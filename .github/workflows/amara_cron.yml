name: Run Amara Trading Bot

on:
  schedule:
    # This runs automatically at 13:45 UTC (9:45 PM Shanghai/Taipei Time) Monday through Friday
    - cron: '45 13 * * 1-5'
  
  # This enables the manual "Run workflow" button in your GitHub interface
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set Up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install alpaca-py anthropic pandas ta requests python-dotenv pytz

      - name: Execute Amara Trading Script
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python amara.py

      - name: Automatically Commit and Push Updated Dashboard
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add amara_dashboard.md || echo "No dashboard file found to add"
          git commit -m "Automated Dashboard Update [skip ci]" || echo "No changes to commit"
          git push
