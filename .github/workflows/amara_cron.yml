name: Run Amara Trading Bot

on:
  workflow_dispatch:
  schedule:
    # Runs automatically every weekday (Monday to Friday) at 14:05 UTC (22:05 Shanghai/Taipei time)
    - cron: '5 14 * * 1-5'

jobs:
  trade:
    runs-on: ubuntu-latest
    
    # CRITICAL: This gives GitHub Actions permission to commit and push files back to your repo
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # Optional: caches your pip dependencies so future runs take less than 15 seconds
          cache: 'pip' 

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install alpaca-py anthropic pandas ta requests python-dotenv pytz

      - name: Execute Amara Trading Script
        # Pass your API keys from GitHub Secrets into environmental variables
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Add any other secrets your amara.py reads via os.environ here
        run: |
          python amara.py

      - name: Automatically Commit and Push Updated Dashboard
        run: |
          # Check if the dashboard file was actually created or modified
          if [ -f "amara_dashboard.md" ]; then
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add amara_dashboard.md
            
            # Only commit if there are actual changes to avoid empty commit errors
            git diff-index --quiet HEAD || git commit -m "Automated Dashboard Update [skip ci]"
            git push
          else
            echo "amara_dashboard.md not found. Skipping commit."
          fi
