name: Run Amara Trading Bot

on:
  workflow_dispatch:
  schedule:
    # Run 1 — Market open (9:35 AM ET = 21:35 Taiwan): entry scan + new buys
    - cron: '35 13 * * 1-5'
    # Run 2 — Pre-close (3:50 PM ET = 03:50 Taiwan next day): trailing stop check + LINE message
    - cron: '50 19 * * 1-5'

jobs:
  trade:
    runs-on: ubuntu-latest

    # CRITICAL: Gives GitHub Actions permission to commit and push files back to your repo
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        # Bumped to v6 to natively run on Node 24 and eliminate warnings
        uses: actions/checkout@v6

      - name: Set up Python
        # Bumped to v6 to natively run on Node 24 and eliminate warnings
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install alpaca-py anthropic pandas ta requests python-dotenv pytz

      - name: Execute Amara Trading Script
        # Safely passes your API keys from GitHub Secrets into environmental variables
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_IDS: ${{ secrets.LINE_USER_IDS }}
          # Paste your Google Drive shareable link here after first deploy:
          #   Settings → Secrets → New secret → Name: DASHBOARD_URL
          # e.g. https://drive.google.com/file/d/XXXX/view?usp=sharing
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: |
          python amara.py

      - name: Commit and Push Updated Dashboard
        run: |
          if [ -f "amara_dashboard.html" ]; then
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add amara_dashboard.html

            # Only commit if there are actual changes to avoid empty commit errors
            git diff-index --quiet HEAD || git commit -m "Automated Dashboard Update [skip ci]"
            git push
          else
            echo "amara_dashboard.html not found. Skipping commit."
          fi

      # ── Publish dashboard to GitHub Pages ────────────────────────────────
      # One-time setup (do this once; then it runs automatically every night):
      #
      #   STEP 1 — Create a Personal Access Token
      #     a. GitHub → profile picture → Settings → Developer settings
      #     b. Personal access tokens → Fine-grained tokens → Generate new token
      #     c. Repository access: select only your "amara-dashboard" repo
      #     d. Permissions → Contents: Read and write → Generate token → copy it
      #
      #   STEP 2 — Add it as a secret in THIS (private bot) repo
      #     Settings → Secrets and variables → Actions → New repository secret
      #     Name: PAGES_DEPLOY_TOKEN   Value: (paste the token from step 1d)
      #
      #   STEP 3 — Add your dashboard URL as a secret (after first successful run)
      #     The URL is: https://YOUR_GITHUB_USERNAME.github.io/amara-dashboard/
      #     Settings → Secrets → New secret
      #     Name: DASHBOARD_URL   Value: https://YOUR_USERNAME.github.io/amara-dashboard/
      #     (Amara will include this link in the nightly LINE message)
      #
      - name: Publish Dashboard to GitHub Pages
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          PAGES_REPO: ${{ secrets.PAGES_REPO }}
        run: |
          if [ -z "$PAGES_TOKEN" ]; then
            echo "PAGES_DEPLOY_TOKEN secret not set — skipping GitHub Pages deploy"
            exit 0
          fi
          # PAGES_REPO should be: YOUR_USERNAME/amara-dashboard
          # Add it as a secret: Settings → Secrets → PAGES_REPO → yourname/amara-dashboard
          if [ -z "$PAGES_REPO" ]; then
            echo "PAGES_REPO secret not set — skipping GitHub Pages deploy"
            exit 0
          fi
          if [ ! -f "amara_dashboard.html" ]; then
            echo "amara_dashboard.html not found — skipping deploy"
            exit 0
          fi
          git clone "https://x-access-token:${PAGES_TOKEN}@github.com/${PAGES_REPO}.git" /tmp/pages
          cp amara_dashboard.html /tmp/pages/index.html
          cd /tmp/pages
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add index.html
          git diff-index --quiet HEAD || git commit -m "Dashboard update [skip ci]"
          git push
          echo "✅ Dashboard published to https://$(echo $PAGES_REPO | cut -d/ -f1).github.io/$(echo $PAGES_REPO | cut -d/ -f2)/"
